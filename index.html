        <span>Total de OS</span>
        <strong id="totalOS">0</strong>
      </div>

      <div class="card">
        <span>Em reparo</span>
        <strong id="reparoOS">0</strong>
      </div>

      <div class="card">

        <strong id="prontoOS">0</strong>

      <form id="osForm">

          <input type="text" name="cliente" required>
