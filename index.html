<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>Oficina do Celular</title>
</head>
<body>
<header class="topbar">
  <div>
    <div class="brand">📱 Oficina do Celular</div>
    <div class="subtitle">Ordens de serviço</div>
  </div>
  <button id="installBtn" class="secondary hidden">Instalar</button>
</header>

<main class="container">
  <section class="stats">
    <div><b id="total">0</b><span>Total</span></div>
    <div><b id="analysis">0</b><span>Em análise</span></div>
    <div><b id="repair">0</b><span>Em reparo</span></div>
    <div><b id="ready">0</b><span>Prontos</span></div>
  </section>

  <div class="actions">
    <button id="newBtn" class="primary">＋ Nova ordem de serviço</button>
    <input id="search" placeholder="Buscar cliente, aparelho ou OS...">
  </div>

  <section id="list" class="list"></section>
</main>

<div id="modal" class="modal hidden">
  <div class="card">
    <div class="modalHead">
      <h2>Nova ordem de serviço</h2>
      <button id="closeBtn" class="icon">✕</button>
    </div>
    <form id="osForm">
      <div class="grid">
        <label>Cliente<input name="cliente" required></label>
        <label>WhatsApp<input name="telefone" inputmode="tel"></label>
        <label>Aparelho<input name="aparelho" required placeholder="Ex.: iPhone XR"></label>
        <label>IMEI<input name="imei"></label>
        <label>Status
          <select name="status">
            <option>Em análise</option><option>Aguardando aprovação</option>
            <option>Em reparo</option><option>Pronto</option><option>Entregue</option>
          </select>
        </label>
        <label>Valor estimado (R$)<input name="valor" type="number" step="0.01"></label>
      </div>
      <label>Defeito informado<textarea name="defeito" required></textarea></label>
      <label>Estado do aparelho / observações<textarea name="observacoes" placeholder="Riscos, trincas, acessórios deixados etc."></textarea></label>
      <label>Fotos do aparelho<input name="fotos" id="fotos" type="file" accept="image/*" multiple></label>
      <div id="preview" class="preview"></div>
      <button class="primary" type="submit">Salvar ordem</button>
    </form>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
