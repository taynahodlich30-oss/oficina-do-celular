<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Oficina do Celular</title>

  <link rel="stylesheet" href="style.css">

  <meta name="theme-color" content="#111827">
</head>

<body>

  <header>
    <h1>📱 Oficina do Celular</h1>
    <p>Controle de ordens de serviço</p>
  </header>

  <main>

    <section class="dashboard">

      <div class="card">
        <strong id="totalOS">0</strong>
        <span>Ordens</span>
      </div>

      <div class="card">
        <strong>🔧</strong>
        <span>Em reparo</span>
      </div>

      <div class="card">
        <strong>✅</strong>
        <span>Prontos</span>
      </div>

    </section>

    <section class="painel">

      <h2>Nova ordem de serviço</h2>

      <form id="osForm">

        <label>Nome do cliente</label>
        <input
          type="text"
          name="cliente"
          placeholder="Digite o nome"
          required
        >

        <label>WhatsApp</label>
        <input
          type="tel"
          name="whatsapp"
          placeholder="(00) 00000-0000"
        >

        <label>Aparelho</label>
        <input
          type="text"
          name="aparelho"
          placeholder="Ex.: iPhone 13"
          required
        >

        <label>IMEI</label>
        <input
          type="text"
          name="imei"
          placeholder="Digite o IMEI"
        >

        <label>Defeito relatado</label>
        <textarea
          name="defeito"
          placeholder="Descreva o problema do aparelho"
          required
        ></textarea>

        <label>Observações</label>
        <textarea
          name="observacoes"
          placeholder="Estado do aparelho, acessórios etc."
        ></textarea>

        <label>Valor estimado</label>
        <input
          type="number"
          name="valor"
          step="0.01"
          placeholder="R$ 0,00"
        >

        <button type="submit">
          💾 Salvar ordem de serviço
        </button>

      </form>

    </section>

    <section class="painel">

      <h2>Ordens de serviço</h2>

      <div id="listaOS">
        <p>Nenhuma ordem cadastrada.</p>
      </div>

    </section>

  </main>

  <footer>
    <p>Oficina do Celular</p>
  </footer>

  <script type="module" src="app.js"></script>

</body>
</html>
